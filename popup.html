<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>팝업창</title>
    <style>
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .popup img {
            max-width: 100%;
            height: auto;
        }
        .popup button {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="popup" id="popup">
        <img src="path/to/your/image.jpg" alt="Popup Image">
        <div>
            <button onclick="closePopup()">닫기</button>
            <button onclick="closeForToday()">오늘 하루 안 보기</button>
        </div>
    </div>
    <script>
        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        function closeForToday() {
            document.getElementById('popup').style.display = 'none';
            var date = new Date();
            date.setDate(date.getDate() + 1);
            document.cookie = "popupClosed=true; expires=" + date.toUTCString() + "; path=/";
        }

        window.onload = function() {
            if (document.cookie.indexOf("popupClosed=true") === -1) {
                document.getElementById('popup').style.display = 'block';
            } else {
                document.getElementById('popup').style.display = 'none';
                document.getElementById('popup').style.display = 'none';
            }

            var imageUrl = localStorage.getItem('popupImageUrl');
            if (imageUrl) {
                document.querySelector('.popup img').src = imageUrl;
            }
        }
    </script>
</body>
