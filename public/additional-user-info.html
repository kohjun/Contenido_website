<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>추가 정보 입력</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container">
    <h1>추가 정보 입력</h1>
    <form id="additional-info-form">
      <!-- CSRF 토큰을 위한 숨겨진 필드 추가 -->
      <input type="hidden" id="_csrf" name="_csrf">
      
      <label for="name">이름:</label>
      <input type="text" id="name" name="name" required>

      <label for="gender">성별:</label>
      <select id="gender" name="gender" required>
        <option value="male">남성</option>
        <option value="female">여성</option>
        <option value="other">기타</option>
      </select>

      <label for="birthDate">생년월일:</label>
      <input type="date" id="birthDate" name="birthDate" required>

      <label for="phonenumber">전화번호:</label>
      <input type="tel" id="phonenumber" name="phonenumber" placeholder="01012345678" required>

      <label for="preferredActivity">활동희망지역:</label>
      <select id="preferredActivity" name="preferredActivity" required>
        <option value="">활동희망지역 선택</option>
        <option value="강남구">강남구</option>
        <option value="강동구">강동구</option>
        <option value="강북구">강북구</option>
        <option value="강서구">강서구</option>
        <option value="관악구">관악구</option>
        <option value="광진구">광진구</option>
        <option value="구로구">구로구</option>
        <option value="금천구">금천구</option>
        <option value="노원구">노원구</option>
        <option value="도봉구">도봉구</option>
        <option value="동대문구">동대문구</option>
        <option value="동작구">동작구</option>
        <option value="마포구">마포구</option>
        <option value="서대문구">서대문구</option>
        <option value="서초구">서초구</option>
        <option value="성동구">성동구</option>
        <option value="성북구">성북구</option>
        <option value="송파구">송파구</option>
        <option value="양천구">양천구</option>
        <option value="영등포구">영등포구</option>
        <option value="용산구">용산구</option>
        <option value="은평구">은평구</option>
        <option value="종로구">종로구</option>
        <option value="중구">중구</option>
        <option value="중랑구">중랑구</option>
      </select>

      <button type="submit">제출</button>
    </form>
  </div>

  <script>
    // 페이지 로드 시 사용자 정보 확인 및 폼 초기화
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // CSRF 토큰 가져오기 (서버에서 제공한다고 가정)
        const csrfResponse = await fetch('/auth/csrf-token');
        if (csrfResponse.ok) {
          const csrfData = await csrfResponse.json();
          document.getElementById('_csrf').value = csrfData.token;
        }

        // 현재 로그인한 사용자 정보 가져오기
        const response = await fetch('/user/info');
        if (response.status === 401) {
          // 로그인되지 않은 경우 로그인 페이지로 리디렉션
          window.location.href = '/auth/kakao?state=' + encodeURIComponent(window.location.href);
          return;
        }

        const user = await response.json();
        
        // 사용자 정보가 이미 있으면 폼에 미리 채우기
        if(user.name) document.getElementById('name').value = user.name;
        if(user.gender) document.getElementById('gender').value = user.gender;
        if(user.birthDate) document.getElementById('birthDate').value = new Date(user.birthDate).toISOString().split('T')[0];
        if(user.phonenumber) document.getElementById('phonenumber').value = user.phonenumber;
        if(user.preferredActivity) document.getElementById('preferredActivity').value = user.preferredActivity;
      } catch (error) {
        console.error('Error fetching user data:', error);
        alert('사용자 정보를 불러오는데 실패했습니다.');
      }
    });

    // 폼 제출 핸들러
    document.getElementById('additional-info-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const formData = {
        name: document.getElementById('name').value,
        gender: document.getElementById('gender').value,
        birthDate: document.getElementById('birthDate').value,
        phonenumber: document.getElementById('phonenumber').value,
        preferredActivity: document.getElementById('preferredActivity').value,
        _csrf: document.getElementById('_csrf').value // CSRF 토큰 포함
      };

      try {
        const response = await fetch('/auth/additional-info', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-CSRF-Token': document.getElementById('_csrf').value // 헤더에도 CSRF 토큰 포함
          },
          body: JSON.stringify(formData),
          credentials: 'same-origin' // 쿠키 포함하여 요청
        });

        const result = await response.json();

        if (response.ok) {
          alert(result.message);
          window.location.href = result.redirectUrl || '/events.html';
        } else {
          alert(`에러: ${result.message}`);
        }
      } catch (error) {
        console.error('Error submitting additional info:', error);
        alert('추가 정보 제출 중 문제가 발생했습니다.');
      }
    });
  </script>
</body>
</html>
