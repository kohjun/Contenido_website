<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘테니도 이벤트 초대장</title>

  <!-- Open Graph / KakaoTalk Link Preview Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="콘테니도 이벤트 초대장">
  <meta property="og:description" content="콘테니도 이벤트 지인 동반 초대장입니다. 링크를 눌러 참가 신청을 완료해 주세요!">
  <meta property="og:image" content="https://contenido.kr/images/invitation_cover.png">
  <meta property="og:image:secure_url" content="https://contenido.kr/images/invitation_cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="CONTENIDO">

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="콘테니도 이벤트 초대장">
  <meta name="twitter:description" content="콘테니도 이벤트 지인 동반 초대장입니다.">
  <meta name="twitter:image" content="https://contenido.kr/images/invitation_cover.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f8fafc;
      font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }
    .invite-container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 24px;
      border: 2px solid #38bdf8;
      box-shadow: 0 20px 40px rgba(2, 132, 199, 0.12);
      overflow: hidden;
    }
    .invite-banner {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      padding: 28px 24px 20px;
      text-align: center;
    }
    .invite-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .invite-title {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .inviter-badge-box {
      margin: 16px 20px 0;
      background: linear-gradient(135deg, #e0f2fe, #bae6fd);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      border: 1px solid #7dd3fc;
    }
    .inviter-badge-box strong {
      color: #0369a1;
      font-size: 1.05rem;
    }
    .invite-body {
      padding: 20px 24px 28px;
    }
    .info-card {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }
    .info-row:last-child { margin-bottom: 0; }
    .info-label {
      color: #0284c7;
      font-weight: 700;
      min-width: 60px;
    }
    .info-val {
      color: #334155;
      flex: 1;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px solid #cbd5e1;
      font-size: 0.9rem;
      font-family: inherit;
      background: #fff;
    }
    .form-control:focus {
      outline: none;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
      transition: transform 0.15s ease, background 0.15s ease;
      margin-top: 10px;
    }
    .submit-btn:hover {
      transform: translateY(-1px);
    }
    .submit-btn:disabled {
      background: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
    .success-container {
      text-align: center;
      padding: 30px 20px;
    }
    .success-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .loading-spinner {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="invite-container">
    <div class="invite-banner">
      <span class="invite-badge">💌 CONTENIDO EVENT</span>
      <h1 class="invite-title" id="inv-event-title">초대장 로딩 중...</h1>
    </div>

    <div class="inviter-badge-box" id="inviter-box" style="display: none;">
      <span style="font-size: 0.8rem; color: #0284c7; font-weight: 700;">초대한 부원</span><br>
      <strong id="inviter-name">-</strong>
    </div>

    <div class="invite-body">
      <div id="loading-view" class="loading-spinner">
        초대장 정보를 불러오고 있습니다...
      </div>

      <div id="error-view" style="display: none; text-align: center; color: #ef4444; padding: 20px;">
        <p id="error-msg">초대장 링크를 확인해 주세요.</p>
      </div>

      <div id="content-view" style="display: none;">
        <div class="info-card">
          <div class="info-row">
            <span class="info-label">📅 일시</span>
            <span class="info-val" id="inv-date-time">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">📍 장소</span>
            <span class="info-val" id="inv-place">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">💵 참가비</span>
            <span class="info-val" id="inv-fee">-</span>
          </div>
        </div>

        <form id="invite-form">
          <div class="form-group">
            <label for="ga-name">지인 성함</label>
            <input type="text" id="ga-name" class="form-control" placeholder="성함 입력" required>
          </div>

          <div class="form-group">
            <label for="ga-phone">연락처</label>
            <input type="tel" id="ga-phone" class="form-control" placeholder="010-XXXX-XXXX" required>
          </div>

          <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
              <label for="ga-gender">성별</label>
              <select id="ga-gender" class="form-control">
                <option value="male">남성</option>
                <option value="female">여성</option>
              </select>
            </div>
            <div class="form-group" style="flex: 1;">
              <label for="ga-age">나이</label>
              <input type="number" id="ga-age" class="form-control" placeholder="나이(세)" min="10" max="100" required>
            </div>
          </div>

          <div id="questions-container"></div>

          <button type="submit" id="submit-btn" class="submit-btn">지인 참가 신청 완료하기</button>
        </form>
      </div>

      <div id="success-view" class="success-container" style="display: none;">
        <div class="success-icon">🎉</div>
        <h2 style="font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 8px;">신청이 완료되었습니다!</h2>
        <p style="color: #64748b; font-size: 0.9rem; line-height: 1.5;">
          지인 동반 신청이 정상 접수되었습니다.<br>행사 당일 뵙겠습니다. 감사합니다!
        </p>
      </div>
    </div>
  </div>

  <script src="/js/invite.js"></script>
</body>
</html>
