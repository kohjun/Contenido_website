<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대외협력팀 이벤트 장소 관리</title>
    <link rel="stylesheet" href="/css/office_cooperation.css">
</head>
<body>
    <div class="cooperation-container">
        <!-- 왼쪽 패널: 검색 및 리스트 -->
        <aside class="sidebar-panel">
            <header class="panel-header">
                <h2>이벤트 장소 관리 📍</h2>
                <p class="panel-subtitle">이벤트에 적합한 장소들을 지도에서 검색하고 관리합니다.</p>
                
                <!-- 검색창 -->
                <div class="search-box-wrapper">
                    <input type="text" id="keyword" placeholder="장소 검색 (예: 혜화역 카페)">
                    <button class="search-button">검색</button>
                </div>
            </header>

            <!-- 이벤트 연동 진행 배너 -->
            <div id="mapping-status-banner" class="mapping-status-banner" style="display: none;">
                <span class="mapping-banner-text">📌 <strong>이벤트 연동 중:</strong> <span id="mapping-event-title"></span></span>
                <button type="button" class="mapping-cancel-btn" onclick="window.CooperationMap.cancelMappingMode()">취소</button>
            </div>

            <!-- 탭 네비게이션 -->
            <nav class="tab-nav">
                <button class="tab active" data-tab="saved">이벤트 장소 목록</button>
                <button class="tab" data-tab="ended-events">이벤트 연동</button>
                <button class="tab" data-tab="search">신규 추가</button>
                <button class="tab" data-tab="route" style="display: none;">경로 보기</button> <!-- cooperation.js 내부 탭 변경 대응용으로 숨김 유지 -->
            </nav>

            <!-- 탭별 컨텐츠 섹션 -->
            <div class="tab-content">
                <!-- 제휴 목록 섹션 -->
                <section id="saved-section" class="content-section active">
                    <div id="saved-places-list" class="places-list">
                        <div class="loading-placeholder">저장된 이벤트 장소를 불러오는 중...</div>
                    </div>
                </section>

                <!-- 종료된 이벤트 연동 섹션 -->
                <section id="ended-events-section" class="content-section">
                    <div id="ended-events-list" class="places-list">
                        <div class="loading-placeholder">종료된 이벤트를 불러오는 중...</div>
                    </div>
                </section>

                <!-- 신규 검색 섹션 -->
                <section id="search-section" class="content-section">
                    <div id="places-list" class="places-list">
                        <div class="empty-placeholder">검색어를 입력하고 검색 버튼을 눌러주세요.</div>
                    </div>
                </section>

                <!-- 경로 섹션 (cooperation.js 내부에서 DOM 오류 방지용) -->
                <section id="route-section" class="content-section" style="display: none;">
                    <div id="route-map" style="width: 100%; height: 200px;"></div>
                </section>
            </div>
        </aside>

        <!-- 오른쪽 패널: 지도 영역 -->
        <main class="map-panel">
            <div id="map-loading" class="map-loading-spinner" style="display: none;">
                <div class="spinner"></div>
                <p>지도를 로딩하고 있습니다...</p>
            </div>
            
            <!-- 실제 지도 컨테이너 -->
            <div id="map"></div>

            <!-- 지도 커스텀 타입 컨트롤러 -->
            <div class="custom-mapcontrol">
                <button id="btnRoadmap" class="selected">지도</button>
                <button id="btnSkyview">스카이뷰</button>
            </div>
        </main>
    </div>

    <!-- 모달 1: 장소 저장 시 상세 정보 입력 모달 -->
    <div id="place-info-modal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <header class="modal-header">
                <h3>이벤트 장소 상세 설정</h3>
                <button class="modal-close" onclick="window.CooperationMap.closePlaceInfoModal()">×</button>
            </header>
            
            <div class="modal-body">
                <!-- 수용인원 선택 -->
                <div class="form-group">
                    <label class="form-label">👥 수용 인원 선택 <span class="required">*</span></label>
                    <div class="capacity-buttons-grid">
                        <button type="button" class="capacity-button" data-capacity="~10">~10명</button>
                        <button type="button" class="capacity-button" data-capacity="~30">~30명</button>
                        <button type="button" class="capacity-button" data-capacity="~50">~50명</button>
                        <button type="button" class="capacity-button" data-capacity="~100">~100명</button>
                    </div>
                </div>

                <!-- 편의시설 선택 -->
                <div class="form-group">
                    <label class="form-label">🔌 지원 편의시설 (다중 선택)</label>
                    <div class="facility-buttons-grid">
                        <button type="button" class="facility-button" data-facility="인터넷/WIFI">📶 와이파이</button>
                        <button type="button" class="facility-button" data-facility="콘센트">🔌 콘센트</button>
                        <button type="button" class="facility-button" data-facility="주차">🚗 주차</button>
                        <button type="button" class="facility-button" data-facility="TV/프로젝터">📹 프로젝터</button>
                        <button type="button" class="facility-button" data-facility="화이트보드">📋 화이트보드</button>
                        <button type="button" class="facility-button" data-facility="음향/마이크">🎤 음향/마이크</button>
                        <button type="button" class="facility-button" data-facility="24시 운영">⏰ 24시 운영</button>
                        <button type="button" class="facility-button" data-facility="음식물반입가능">🍕 음식물 반입</button>
                        <button type="button" class="facility-button" data-facility="의자/테이블">🪑 테이블/의자</button>
                        <button type="button" class="facility-button" data-facility="내부화장실">🚽 내부 화장실</button>
                    </div>
                </div>
            </div>

            <footer class="modal-footer">
                <button type="button" class="modal-cancel-btn" onclick="window.CooperationMap.closePlaceInfoModal()">취소</button>
                <button type="button" class="modal-save-btn" onclick="window.CooperationMap.savePlaceWithInfo()">이벤트 장소로 저장</button>
            </footer>
        </div>
    </div>

    <!-- 모달 2: 에러 및 메시지 안내 모달 -->
    <div id="error-modal" class="modal-overlay" style="display: none;">
        <div class="modal-container error-modal-container">
            <header class="modal-header">
                <h3>안내</h3>
                <button class="modal-close" onclick="window.CooperationMap.closeErrorModal()">×</button>
            </header>
            <div class="modal-body">
                <p id="error-message" class="error-msg-content"></p>
            </div>
            <footer class="modal-footer">
                <button type="button" class="modal-close-btn" onclick="window.CooperationMap.closeErrorModal()">확인</button>
            </footer>
        </div>
    </div>
</body>
</html>
