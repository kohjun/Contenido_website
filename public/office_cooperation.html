<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대외협력팀</title>
    <link rel="stylesheet" href="/css/cooperation.css">
</head>
<body>
    <div class="container">
        <h1 style="text-align: center;">대외협력팀 관리 페이지</h1>
        <br>
          <a class="switch-page" href="/office_cooperation.html">대외협력팀 페이지</a>
          <a class="switch-page" href="/office">운영진 페이지</a><br><br>
        
        <div class="tabs">
            <div class="tab active" data-tab="search">장소 검색</div>
            <div class="tab" data-tab="todo">TO-DO 리스트</div>
            <div class="tab" data-tab="saved">장소 리스트</div>
        </div>

        <!-- 지도 로딩 상태 표시 -->
        <div id="map-loading" class="loading-container">
            <div class="loading-spinner"></div>
            <p>지도를 불러오는 중입니다... 잠시만 기다려주세요.</p>
        </div>

        <!-- 장소 검색 섹션 -->
        <div id="search-section" class="content-section active">
            <div class="search-box">
                <input type="text" id="keyword" class="search-input" placeholder="장소를 검색하세요">
                <button onclick="window.CooperationMap.searchPlaces()" class="search-button">검색</button>
            </div>
            
            <div class="map-container">
                <div id="map" style="width:100%;height:100%;"></div>
                <!-- 지도 타입 컨트롤 -->
                <div class="map_type_control">
                    <span id="btnRoadmap" class="selected">지도</span>
                    <span id="btnSkyview">스카이뷰</span>
                </div>
                <!-- 지도 확대/축소 컨트롤 -->
                <div class="map_zoom_control">
                    <span onclick="window.CooperationMap.zoomIn()">+</span>
                    <span onclick="window.CooperationMap.zoomOut()">-</span>
                </div>
            </div>
            
            <div id="places-list" class="places-list"></div>
        </div>
         <!-- TODO 리스트 섹션 -->
         <div id="todo-section" class="content-section">
          <div class="todo-container">
              <div class="todo-input-container">
                  <input type="text" id="todo-input" placeholder="새로운 할 일을 입력하세요">
                  <button onclick="addTodo()" class="add-todo-button">추가</button>
              </div>
              <div class="todo-filters">
                  <button class="filter-button active" onclick="filterTodos('all')">전체</button>
                  <button class="filter-button" onclick="filterTodos('active')">진행중</button>
                  <button class="filter-button" onclick="filterTodos('completed')">완료</button>
              </div>
              <ul id="todo-list" class="todo-list"></ul>
          </div>
      </div>

        <!-- 길찾기 섹션 -->
        <div id="route-section" class="content-section">
            <div class="route-search">
                <div class="route-points">
                    <input type="text" id="start-point" class="route-input" placeholder="출발지 입력">
                    <button onclick="searchPoint('start')" class="search-button">검색</button>
                </div>
                <div class="route-points">
                    <input type="text" id="end-point" class="route-input" placeholder="도착지 입력">
                    <button onclick="searchPoint('end')" class="search-button">검색</button>
                </div>
                <button onclick="findRoute()" class="search-button">길찾기</button>
            </div>
            
            <div id="route-map" class="map-container"></div>
            <div id="route-result" class="route-result"></div>
        </div>

        <!-- 저장된 장소 섹션 -->
        <div id="saved-section" class="content-section">
            <div id="saved-places-list"></div>
        </div>
    </div>
    <!-- 장소 정보 모달 -->
<div id="place-info-modal" class="place-info-modal">
    <div class="place-info-content">
      <h2>장소 정보 입력</h2>
      
      <!-- 수용 인원 선택 -->
      <div class="capacity-selection">
        <h3>수용 인원</h3>
        <div class="capacity-buttons">
          <button class="capacity-button" data-capacity="~10">~10명</button>
          <button class="capacity-button" data-capacity="~30">~30명</button>
          <button class="capacity-button" data-capacity="~50">~50명</button>
          <button class="capacity-button" data-capacity="~100">~100명</button>
        </div>
      </div>
  
      <!-- 시설 선택 -->
      <div class="facilities-selection">
        <h3>추가 시설</h3>
        <div class="facilities-grid">
          <button class="facility-button" data-facility="TV/프로젝터">
            <span class="facility-icon">📺</span>TV/프로젝터
          </button>
          <button class="facility-button" data-facility="인터넷/WIFI">
            <span class="facility-icon">📶</span>인터넷/WIFI
          </button>
          <button class="facility-button" data-facility="복사/인쇄기">
            <span class="facility-icon">🖨️</span>복사/인쇄기
          </button>
          <button class="facility-button" data-facility="화이트보드">
            <span class="facility-icon">🎨</span>화이트보드
          </button>
          <button class="facility-button" data-facility="음향/마이크">
            <span class="facility-icon">🎤</span>음향/마이크
          </button>
          <button class="facility-button" data-facility="취사시설">
            <span class="facility-icon">🍳</span>취사시설
          </button>
          <button class="facility-button" data-facility="음식물반입가능">
            <span class="facility-icon">🍱</span>음식물반입가능
          </button>
          <button class="facility-button" data-facility="주차">
            <span class="facility-icon">🅿️</span>주차
          </button>
          <button class="facility-button" data-facility="PC/노트북">
            <span class="facility-icon">💻</span>PC/노트북
          </button>
          <button class="facility-button" data-facility="의자/테이블">
            <span class="facility-icon">🪑</span>의자/테이블
          </button>
          <button class="facility-button" data-facility="콘센트">
            <span class="facility-icon">🔌</span>콘센트
          </button>
          <button class="facility-button" data-facility="24시 운영">
            <span class="facility-icon">🕐</span>24시 운영
          </button>
          <button class="facility-button" data-facility="연중무휴">
            <span class="facility-icon">📅</span>연중무휴
          </button>
          <button class="facility-button" data-facility="간단한 다과/음료">
            <span class="facility-icon">☕</span>간단한 다과/음료
          </button>
          <button class="facility-button" data-facility="내부화장실">
            <span class="facility-icon">🚽</span>내부화장실
          </button>
          <button class="facility-button" data-facility="마트/편의점">
            <span class="facility-icon">🏪</span>마트/편의점
          </button>
          <button class="facility-button" data-facility="남/여화장실 구분">
            <span class="facility-icon">🚻</span>남/여화장실 구분
          </button>
        </div>
      </div>
  
      <div class="modal-buttons">
        <button class="modal-button cancel-button" onclick="window.CooperationMap.closePlaceInfoModal()">취소</button>
        <button class="modal-button save-button" onclick="window.CooperationMap.savePlaceWithInfo()">저장</button>
      </div>
    </div>
  </div>
    <!-- 에러 모달 -->
    <div id="error-modal" class="modal">
        <div class="modal-content">
            <h2>오류 발생</h2>
            <p id="error-message"></p>
            <button onclick="closeErrorModal()" class="modal-button">확인</button>
        </div>
    </div>

    <script src="/js/office/cooperation.js"></script>
    <script type="text/javascript" 
        src="//dapi.kakao.com/v2/maps/sdk.js?appkey=a20d5436081d8f992f48fb3b6205f2b9&libraries=services,drawing&autoload=false"
        onload="window.initMaps()">
    </script>
</body>
</html>
