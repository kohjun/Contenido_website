<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>콘테니도 운영진 페이지</title>
    <link rel="stylesheet" href="/css/office.css" />
    <link rel="stylesheet" href="/css/organization.css" />
</head>
<body>
    <!-- 사이드바 컨테이너 -->
    <div id="sidebar-container"></div>

    <!-- 메인 컨텐츠 -->
    <main class="main-content" id="main-content">
        <div class="header-controls">
            <h1>CONTENID-O 동아리 운영진 조직도</h1>
            
        </div>
        
        <div class="org-chart">
            <div class="department president">
                <h2>회장단 <span class="member-count"></span></h2>
                <div class="member-list" id="administration"></div>
            </div>
            
            <div class="departments">
                <div class="department">
                    <h2>운영부 <span class="member-count"></span></h2>
                    <div class="teams">
                        <div class="team">
                            <h3>운영팀 <span class="member-count"></span></h3>
                            <div class="member-list" id="operationTeam"></div>
                        </div>
                        <div class="team">
                            <h3>대외협력팀 <span class="member-count"></span></h3>
                            <div class="member-list" id="cooperationTeam"></div>
                        </div>
                        <div class="team">
                            <h3>인사팀 <span class="member-count"></span></h3>
                            <div class="member-list" id="HumanResourceTeam"></div>
                        </div>
                        <div class="team">
                            <h3>재무팀 <span class="member-count"></span></h3>
                            <div class="member-list" id="financeTeam"></div>
                        </div>
                    </div>
                </div>
                
                <div class="department">
                    <h2>홍보부 <span class="member-count"></span></h2>
                    <div class="teams">
                        <div class="team">
                            <h3>홍보팀 <span class="member-count"></span></h3>
                            <div class="member-list" id="marketingTeam"></div>
                        </div>
                        <div class="team">
                            <h3>디자인팀 <span class="member-count"></span></h3>
                            <div class="member-list" id="designTeam"></div>
                        </div>
                        <div class="team">
                            <h3>영상제작팀 <span class="member-count"></span></h3>
                            <div class="member-list" id="videoTeam"></div>
                        </div>
                    </div>
                </div>
                
                <div class="department">
                    <h2>기획부 <span class="member-count"></span></h2>
                    <div class="teams">
                        <div class="team">
                            <h3>기획팀 <span class="member-count"></span></h3>
                            <div class="member-list" id="PlanningTeam"></div>
                        </div>
                        <div class="team">
                            <h3>정기모임팀 <span class="member-count"></span></h3>
                            <div class="member-list" id="regularTeam"></div>
                        </div>
                        <div class="team">
                            <h3>스태프팀 <span class="member-count"></span></h3>
                            <div class="member-list" id="staffTeam"></div>
                        </div>
                        <div class="team">
                            <h3>스타터팀 <span class="member-count"></span></h3>
                            <div class="member-list" id="starterTeam"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 스크립트 -->
    <script src="/js/office/sidebar.js"></script>
    <script src="/js/office/organization.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('sidebar-container');
            Sidebar.init(container);
        });
    </script>
</body>
</html>
