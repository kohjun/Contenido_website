<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이벤트 내용</title>
  <link rel="stylesheet" href="/css/additional-info.css?v=20260609">
  <!-- 카카오 SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.5.0/kakao.min.js"></script>
  <!-- 통합된 nav-injector.js만 포함 (auth-module.js 통합됨) -->
  <script src="/js/utils/nav-injector.js?v=20260602" defer></script>
</head>
<body>
  <div class="container">
    <!-- 이벤트 정보 -->
    <div id="event-info" class="event-info">


      <!-- 메인 이미지 섹션 -->
      <div class="main-event-image">
        <img src="" alt="이벤트 메인 이미지" id="main-event-image">
      </div>


      <!-- 이벤트 상세 정보 섹션 -->
      <div class="event-details-container">
        <div id="event-details" class="event-details-section">
          <div class="title-share-container">
            <h1 id="event-title" class="event-title"></h1>
            <!-- 공유 버튼 -->
            <div class="share-btn-container">
              <button class="share-button" onclick="openShareModal()">
                <img src="/images/share_icon.png" alt="공유하기">
              </button>
            </div>
          </div>
          <div class="icon-info">
            <div class="info-row">
              <img src="/images/additional-eventLocation.png" alt="위치" class="info-icon">
              <span id="event-place" class="info-value"></span>
            </div>
            <div class="info-row">
              <img src="/images/additional-eventParticipants.png" alt="인원" class="info-icon">
              <span id="event-participants" class="info-value"></span>
            </div>
            <div class="info-row">
              <img src="/images/additional-eventDate.png" alt="날짜" class="info-icon">
              <span id="event-date" class="info-value"></span>
            </div>
            <div class="info-row">
              <img src="/images/additional-eventTime.png" alt="시간" class="info-icon">
              <span class="info-value"><span id="event-start-time"></span> ~ <span id="event-end-time"></span></span>
            </div>
            <div class="info-row">
              <img src="/images/additional-eventFee.png" alt="참가비" class="info-icon">
              <span class="info-value"><span id="event-fee"></span></span>
            </div>
            <!-- 태그 (참가비 바로 아래, 조건부 표시) -->
            <div class="info-row" id="event-tags-row" style="display: none;">
              <span class="info-value" id="event-tags"></span>
            </div>
            <!-- 신청 기간 (조건부 표시) -->
            <div class="info-row" id="event-application-period-row" style="display: none;">
              <img src="/images/additional-eventDate.png" alt="신청 기간" class="info-icon">
              <span class="info-value">신청 기간: <span id="event-application-period"></span></span>
            </div>
            <!-- 참가자 확정 마감 (조건부 표시) -->
            <div class="info-row" id="event-confirmation-deadline-row" style="display: none;">
              <img src="/images/additional-eventDate.png" alt="확정 마감" class="info-icon">
              <span class="info-value">확정 마감: <span id="event-confirmation-deadline"></span></span>
            </div>
            <!-- 이벤트 내용 섹션 -->
            <div class="event-contents-section">
              <img src="/images/eventContents.png" alt="참가비" class="info-icon">
              &nbsp; <span id="event-contents"></span>
            </div>
            <div class="refund-policy-section">
              <h3><span>환불정책</span></h3>
              &nbsp; <div id="refund-policy-display" class="refund-policy-content"></div>
            </div>
          </div>


          
        </div>
        
        
      </div>

      <!-- 수정 모드 컨트롤 -->
      <div id="edit-controls" style="display: none;">
        <div class="edit-card image-section">
          <h3 class="edit-section-title">🖼️ 이벤트 이미지 <small>(최대 3장)</small></h3>
          <div class="image-container">
            <label for="edit-image" class="image-upload-button" id="image-upload-label">
              <span class="plus-icon">+</span>
              <span class="upload-text">이미지 추가</span>
              <input type="file" id="edit-image" accept="image/*" multiple class="image-upload-input" onchange="handleImagePreview(event)">
            </label>
          </div>
        </div>

        <!-- 확인/취소 버튼 -->
        <div id="confirmation-buttons" class="edit-actions">
          <button id="confirm-button" class="btn btn-primary btn-lg" onclick="submitEdit()">저장하기</button>
          <button id="cancel-button" class="btn btn-ghost" onclick="cancelEdit()">취소</button>
        </div>
      </div>

      <!-- 수정/신청 버튼 -->
      <div class="button-group">
        <!-- 지원서/신청 섹션 — 목록으로 버튼 바로 위에 위치 -->
        <div id="application-section"></div>
        <button id="modify-button" onclick="enableEdit()" style="display: none">수정하기</button>
        <button onclick="window.location.href='events.html'">목록으로</button>
      </div>
    </div>

    <!-- 공유 모달 -->
    <div id="shareModal" class="share-modal">
      <h3>공유하기</h3>
      <div class="share-option" id="kakao-share-button" onclick="initializeKakaoShare()">
        <img src="https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_small.png" alt="카카오톡">
        <span>카카오톡으로 공유</span>
      </div>
      <div class="share-option" onclick="copyLink()">
        <span>링크 복사</span>
      </div>
      <button onclick="closeShareModal()" style="margin-top: 15px;">닫기</button>
    </div>
    <div id="modalBackdrop" class="modal-backdrop" onclick="closeShareModal()"></div>

    <!-- 약관 동의 모달 유틸 -->
    <script src="/js/utils/apply-confirm.js"></script>
    <!-- 이벤트 관련 스크립트 -->
    <script src="/js/modify-event.js?v=20260610"></script>
  </div>
</body>
</html>
