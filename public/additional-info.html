<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이벤트 내용</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.5.0/kakao.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- 이벤트 정보 -->
    <div id="event-info" class="event-info">
      <div id="event-details">
        <p>제목: <span id="event-title"></span></p>
        <p>장소: <span id="event-place"></span></p>
        <p>날짜: <span id="event-date"></span></p>
        <p>참가 인원: <span id="event-participants"></span></p>
        <p>시작 시간: <span id="event-start-time"></span></p>
        <p>종료 시간: <span id="event-end-time"></span></p>
        <p>참가비: <span id="event-fee"></span></p>
        <p>내용: <span id="event-contents"></span></p>
        <a id="kakao-share-button" href="javascript:;">
          <img src="https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_medium.png"
            alt="카카오톡 공유하기" />
        </a>
      </div>
      

      <!-- 이미지 컨테이너 -->
      <div id="event-image-container" class="event-image-container"></div>
      
      <!-- 이미지 수정 시 미리보기 -->
      <div id="image-preview"></div>
    </div>
    
    <!-- 수정 모드 컨트롤 -->
    <div id="edit-controls" style="display: none;">
      <div class="image-section">
        <h3>이벤트 이미지(최대 3장)</h3>
        <div class="image-container">
          <label for="edit-image" class="image-upload-button" id="image-upload-label">
            <span class="plus-icon">+</span>
            <span class="upload-text">이미지 추가</span>
            <input type="file" id="edit-image" accept="image/*" multiple class="image-upload-input">
          </label>
        </div>
      </div>
      
      <!-- 확인/취소 버튼 -->
      <div id="confirmation-buttons">
        <button id="confirm-button" onclick="submitEdit()">확인</button>
        <button id="cancel-button" onclick="cancelEdit()">취소</button>
      </div>
    </div>

    <!-- 지원서 섹션 -->
    <div id="application-section"></div>

    <!-- 수정 버튼 -->
    <div class="button-group">
      <button id="modify-button" onclick="enableEdit()" style="display: none">수정하기</button>
      <button onclick="window.location.href='events.html'">목록으로</button>
      
    </div>
  </div>

  <script src="/js/modify-event.js"></script>
  <script src="/js/utils/nav-injector.js"></script>
</body>
</html>
