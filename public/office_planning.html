<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기획팀 분석 대시보드 · Contenido</title>
    <link rel="stylesheet" href="/css/design-system.css?v=20261119">
    <link rel="stylesheet" href="/css/office/planning.css?v=20261119">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="pl-container">
        <!-- 헤더 -->
        <header class="pl-header">
            <h2>기획팀 분석 대시보드</h2>
            <p>팀별 이벤트 통계, 참가율, 평점 및 스타터-스태프 명단을 관리합니다</p>
        </header>

        <!-- 스타터-스태프 명단 관리 섹션 (접고 열 수 있는 탭) -->
        <section class="starter-staff-section">
            <button type="button" class="starter-staff-toggle-btn" onclick="window.PlanningDashboard ? window.PlanningDashboard.toggleStarterStaffTab() : null">
                <div class="toggle-btn-left">
                    <h3 class="section-title">
                        스타터-스태프 명단 관리 <small class="starter-sub-note">(매월 의무신청 경고 자동 면제)</small>
                    </h3>
                    <p class="section-desc">스타터-스태프 인원을 지정하여 확정하면 인사팀 페이지에서 '스타터-스태프' 표시 및 매달 미신청 경고에서 자동으로 제외됩니다.</p>
                </div>
                <span class="starter-tab-chev" id="starter-tab-chev">▾</span>
            </button>

            <div class="starter-staff-card-body" id="starter-staff-panel" hidden style="display: none; margin-top: 16px;">
                <!-- 상단: 선택/저장된 확정 스타터-스태프 명단 요약 박스 -->
                <div id="confirmed-starter-staff-box" class="confirmed-starter-box">
                    <div class="confirmed-starter-head">
                        <h4>
                            확정된 스타터-스태프 명단 (<b id="confirmed-starter-staff-count">0</b>명)
                        </h4>
                    </div>
                    <div id="confirmed-starter-staff-list" class="confirmed-starter-list">
                        <span class="starter-empty-hint">확정된 스타터-스태프가 없습니다.</span>
                    </div>
                </div>

                <div class="starter-staff-search-row">
                    <input type="text" id="starter-staff-search" placeholder="회원 이름 또는 전화번호 뒷자리로 검색..." oninput="window.PlanningDashboard && window.PlanningDashboard.filterMembers()">
                    <span class="starter-staff-count-tag">선택 중인 인원: <b id="starter-staff-selected-count">0</b>명</span>
                </div>

                <div id="starter-staff-member-list" class="starter-staff-member-grid">
                    <div class="loading-placeholder">회원 목록을 불러오는 중...</div>
                </div>

                <div class="starter-staff-footer">
                    <button type="button" class="btn-save-starter" onclick="window.PlanningDashboard && window.PlanningDashboard.saveStarterStaff()">
                        스타터-스태프 명단 저장
                    </button>
                </div>
            </div>
        </section>

        <!-- 탭: 전체비교 / A / B / C / D -->
        <nav class="pl-tab-bar" id="pl-tab-bar">
            <button class="pl-tab is-active" data-team="compare">전체 비교</button>
            <button class="pl-tab" data-team="A">A팀</button>
            <button class="pl-tab" data-team="B">B팀</button>
            <button class="pl-tab" data-team="C">C팀</button>
            <button class="pl-tab" data-team="D">D팀</button>
        </nav>

        <!-- range picker -->
        <div class="pl-range" id="pl-range">
            <span class="pl-range-label">기간</span>
            <button class="pl-chip is-active" data-range="all">전체</button>
            <button class="pl-chip" data-range="3m">최근 3개월</button>
            <button class="pl-chip" data-range="6m">최근 6개월</button>
            <button class="pl-chip" data-range="year">올해</button>
        </div>

        <!-- 패널 영역 -->
        <div id="pl-panel">
            <div class="pl-loading">
                <div class="spinner"></div>
                불러오는 중…
            </div>
        </div>
    </div>

    <script src="/js/office/planning.js"></script>
    <script>
      // sidebar.js가 동적 주입한 경우 자동 부팅, 직접 로드 시도 처리
      document.addEventListener('DOMContentLoaded', () => {
        if (window.bootPlanning) window.bootPlanning();
      });
    </script>
</body>
</html>
