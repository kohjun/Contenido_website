<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운영팀 대시보드</title>
    <link rel="stylesheet" href="/css/operation.css">
</head>
<body>
    <div class="dashboard">
        <h2>동아리 현황 대시보드</h2>
        
        <div class="dashboard-grid">
            <div class="stats-container">
                <div class="stats-grid">
                    <div class="stat-card total">
                        <div class="stat-icon">👥</div>
                        <div class="stat-info">
                            <h4>총 부원 수</h4>
                            <span id="totalMembers">-</span>
                        </div>
                    </div>
                    <div class="stat-card active">
                        <div class="stat-icon">✨</div>
                        <div class="stat-info">
                            <h4>활동 부원 수</h4>
                            <span id="activeMembers">-</span>
                        </div>
                    </div>
                    <div class="stat-card average">
                        <div class="stat-icon">📊</div>
                        <div class="stat-info">
                            <h4>평균 정기 참여 횟수</h4>
                            <span id="avgParticipation">-</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="chart-container">
                <h3>부원 구성</h3>
                <canvas id="roleChart"></canvas>
            </div>
            
            <div class="chart-container">
                <h3>성별 분포</h3>
                <canvas id="genderChart"></canvas>
            </div>
            
            <div class="chart-container">
                <h3>선호 활동지역 TOP 5</h3>
                <canvas id="activityChart"></canvas>
            </div>

            <div class="age-info">
                <h3>부원 평균 연령</h3>
                <div class="age-display">
                    <span id="averageAge">-</span>
                    <span class="unit">세</span>
                </div>
            </div>

            <div class="chart-container growth-chart">
                <h3>월별 회원가입 현황</h3>
                <canvas id="growthChart"></canvas>
            </div>
        </div>
    </div>
    
    <!-- 초기화 코드만 남기고 스크립트 태그들은 제거 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Dashboard && !window.dashboardInitialized) {
                window.Dashboard.initialize().catch(console.error);
                window.dashboardInitialized = true;
            }
        });
    </script>
</body>
</html>
