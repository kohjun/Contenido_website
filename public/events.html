    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // 쿠키 체크
        if (!getCookie('dontShowToday1')) {
          showPopup('popup1');
        }
        if (!getCookie('dontShowToday2')) {
          showPopup('popup2');
        }
        startImageSlider();
        // loadHomeAnnouncements 제거
      });

      function showPopup(popupId) {
        document.getElementById(popupId).style.display = 'block';
      }

      function closePopup(popupId) {
        const popup = document.getElementById(popupId);
        const dontShowToday = document.getElementById(`dont-show-today-${popupId === 'popup1' ? '1' : popupId === 'popup2' ? '2' : ''}`).checked;
        
        if (dontShowToday) {
          // 쿠키 설정 (24시간)
          const date = new Date();
          date.setTime(date.getTime() + (24 * 60 * 60 * 1000));
          document.cookie = `dontShowToday${popupId === 'popup1' ? '1' : popupId === 'popup2' ? '2' : ''}=true; expires=${date.toUTCString()}; path=/`;
        }
        
        popup.style.display = 'none';
      }

      // 쿠키 가져오기 함수
      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
      }

      // 팝업 닫기 버튼 이벤트
      document.querySelectorAll('.close-button').forEach(button => {
        button.addEventListener('click', function() {
          closePopup(button.parentElement.parentElement.id);
        });
      });

      // 팝업 외부 클릭 시 닫기
      document.querySelectorAll('.popup').forEach(popup => {
        popup.addEventListener('click', function(e) {
          if (e.target === this) {
            closePopup(this.id);
          }
        });
      });
        
      function checkParticipationStatus() {
        window.location.href = '/participation-status.html';
      }

      async function updateButtonVisibility() {
        try {
          const response = await fetch('/user/info');
          if (response.status === 200) {
            document.getElementById('kakao-login-button').style.display = 'none';
            document.getElementById('logout-button').style.display = 'block';
          } else {
            document.getElementById('kakao-login-button').style.display = 'block';
            document.getElementById('logout-button').style.display = 'none';
          }
        } catch (error) {
          console.error('Error checking login status:', error);
          document.getElementById('kakao-login-button').style.display = 'block';
          document.getElementById('logout-button').style.display = 'none';
        }
      }

      document.addEventListener('DOMContentLoaded', updateButtonVisibility);

      function loginWithKakao() {
        window.location.href = '/auth/kakao';
      }

      function OnEvents() {
        window.location.href = '/events.html';
      }
      function OnOfficer() {
        window.location.href = '/officer.html';
      }
      function logout() {
        window.location.href = '/auth/logout';
      }

      function startImageSlider() {
        document.querySelectorAll('.popup-images').forEach(popupImages => {
          const images = popupImages.querySelectorAll('img');
          let currentIndex = 0;
  
          images[currentIndex].style.display = 'block';
  
          setInterval(() => {
            images[currentIndex].style.display = 'none';
            currentIndex = (currentIndex + 1) % images.length;
            images[currentIndex].style.display = 'block';
          }, 3000);
        });
      }

      function showAnnouncementModal(title, content) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-content').textContent = content;
        document.getElementById('announcement-modal').style.display = 'block';
      }

      function closeAnnouncementModal() {
        document.getElementById('announcement-modal').style.display = 'none';
      }

      // 모달 외부 클릭 시 닫기
      window.onclick = function(event) {
        const modal = document.getElementById('announcement-modal');
        if (event.target == modal) {
          modal.style.display = 'none';
        }
      }
    </script>
