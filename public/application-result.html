<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지원 결과 확인</title>
    <link rel="stylesheet" href="/css/application-result.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <div class="result-container">
            <div class="header-section">
                <h1>지원 결과 확인</h1>
                <p class="subtitle">나의 지원 결과를 확인합니다</p>
            </div>

            <div id="result-display" class="hidden">
                <div class="result-card">
                    <div class="result-header">
                        <h2>지원 결과</h2>
                    </div>
                    <div class="result-body">
                        <p id="result-status" class="status"></p>
                        <p id="result-message" class="message"></p>
                        <div id="kakao-link" class="hidden">
                            <div class="kakao-section">
                                <p>아래 버튼을 클릭하여 카카오톡 채팅방에 입장해주세요</p>
                                <button id="join-kakao" class="kakao-button">
                                    <img src="/images/kakao-icon.png" alt="카카오톡 아이콘" class="kakao-icon">
                                    카카오톡 채팅방 입장
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="error-message" class="hidden error-container">
                <span class="error-icon">⚠️</span>
                <p>제출된 지원서를 찾을 수 없습니다</p>
            </div>

            <div class="back-button-container">
                <button onclick="location.href='/'">
                    <span class="button-icon">←</span>
                    <span class="button-text">메인으로 돌아가기</span>
                </button>
            </div>
        </div>
    </div>
    <script src="/js/application-result.js"></script>
</body>
</html>
