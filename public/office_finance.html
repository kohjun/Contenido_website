<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재무팀 관리</title>
    <link rel="stylesheet" href="/css/finance.css">
    <!-- SheetJS 라이브러리 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>재무팀 관리</h1>
        
        <div class="upload-section">
            <h2>거래 내역 조회</h2>
            <div class="input-wrapper">
                <input type="file" id="transaction-upload" accept=".json">
                <button id="verify-button">데이터 보기</button>
            </div>
        </div>

        <div id="table-container" class="hidden">
            <table id="transaction-table">
                <thead>
                    <tr>
                        <th>거래일시</th>
                        <th>구분</th>
                        <th>거래금액</th>
                        <th>거래 후 잔액</th>
                        <th>거래구분</th>
                        <th>내용</th>
                        <th>메모</th>
                    </tr>
                </thead>
                <tbody id="transaction-body"></tbody>
            </table>

            <div class="pagination">
                <button id="prev-page" disabled>이전</button>
                <span id="page-info"></span>
                <button id="next-page">다음</button>
            </div>

            <div class="fee-verify-section">
                <button id="fee-verify-button" class="hidden">입금 처리</button>
            </div>
        </div>
    </div>
    <script src="/js/office/finance.js"></script>
</body>
</html>
