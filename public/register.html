<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 · Contenido</title>
  <link rel="icon" href="/images/Contenido_Logo.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/design-system.css?v=20261119">
  <style>
    body {
      position: relative;
      overflow-x: clip;
      background:
        radial-gradient(900px 520px at 50% -12%, var(--brand-100) 0%, var(--c-bg) 52%, #FFFFFF 100%);
      color: var(--c-text);
      min-height: 100dvh;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(72px);
      z-index: 0;
      pointer-events: none;
    }
    body::before { width: 340px; height: 340px; background: var(--brand-300); opacity: 0.42; top: -90px; right: -90px; }
    body::after  { width: 300px; height: 300px; background: var(--brand-200); opacity: 0.52; bottom: -100px; left: -80px; }

    .auth-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 432px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--r-2xl);
      padding: 36px 30px 28px;
      box-shadow: var(--sh-lg);
      border: 1px solid var(--c-border);
    }

    .auth-hero { text-align: center; margin-bottom: 26px; }
    .auth-emblem {
      width: 54px;
      height: 54px;
      margin: 0 auto 12px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--brand-400) 0%, var(--brand-600) 100%);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--sh-brand);
    }
    .auth-hero .logo {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--c-brand);
      letter-spacing: 0.14em;
    }
    .auth-hero h1 { margin: 8px 0 6px; font-size: 1.48rem; letter-spacing: -0.02em; }
    .auth-hero p { margin: 0; color: var(--c-text-muted); font-size: 0.88rem; line-height: 1.55; }

    .field { margin-bottom: 15px; }
    .field label {
      display: block;
      font-size: 0.82rem;
      color: var(--c-text-soft);
      font-weight: 700;
      margin-bottom: 7px;
      padding-left: 2px;
    }
    .input {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid var(--c-border);
      border-radius: var(--r-md);
      background: var(--c-surface-2);
      color: var(--c-text);
      font-size: 0.96rem;
      outline: none;
      transition: border-color 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
    }
    .input:focus {
      border-color: var(--c-brand);
      background: var(--c-surface);
      box-shadow: 0 0 0 4px var(--c-focus-ring);
    }
    .input::placeholder { color: var(--c-text-faint); }

    .hint { font-size: 0.76rem; color: var(--c-text-faint); margin: 6px 0 0 4px; }
    .hint.ok  { color: var(--c-ok); font-weight: 600; }
    .hint.bad { color: var(--c-danger); font-weight: 600; }

    .submit-btn {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: none;
      border-radius: var(--r-md);
      background: linear-gradient(135deg, var(--brand-500) 0%, var(--brand-600) 100%);
      color: #FFFFFF;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--sh-brand);
      transition: translate 160ms ease, box-shadow 160ms ease;
    }
    .submit-btn:hover:not(:disabled) {
      translate: 0 -1.5px;
      box-shadow: 0 12px 26px rgba(10, 132, 254, 0.38);
    }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .auth-foot { margin-top: 22px; text-align: center; font-size: 0.86rem; color: var(--c-text-muted); }
    .auth-foot a { color: var(--c-brand); font-weight: 700; text-decoration: none; }
    .auth-foot a:hover { text-decoration: underline; }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      translate: -50% 18px;
      background: var(--brand-950);
      color: #FFFFFF;
      padding: 13px 22px;
      border-radius: var(--r-pill);
      font-size: 0.88rem;
      box-shadow: var(--sh-lg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease, translate 200ms var(--ease-spring);
      z-index: 1100;
      max-width: 90vw;
    }
    .toast.is-show { opacity: 1; translate: -50% 0; }
    .toast.error { background: var(--c-danger); }
    .toast.success { background: var(--c-ok); }

    @media (max-width: 480px) {
      .auth-card { padding: 30px 22px 24px; border-radius: var(--r-xl); }
      .input { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="auth-hero">
      <div class="auth-emblem" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      </div>
      <div class="logo">CONTENIDO</div>
      <h1>함께 시작해요</h1>
      <p>이메일과 비밀번호로<br>간단하게 계정을 만드세요</p>
    </div>

    <form id="register-form" autocomplete="on">
      <div class="field">
        <label for="displayName">이름 / 닉네임</label>
        <input class="input" type="text" id="displayName" name="displayName" placeholder="표시될 이름" autocomplete="name" enterkeyhint="next" required>
      </div>
      <div class="field">
        <label for="email">이메일</label>
        <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" inputmode="email" enterkeyhint="next" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input class="input" type="password" id="password" name="password" placeholder="8자 이상" minlength="8" autocomplete="new-password" enterkeyhint="done" required>
        <p class="hint" id="pw-hint">8자 이상 입력해주세요</p>
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">회원가입</button>
    </form>

    <div class="auth-foot">
      이미 계정이 있으신가요? <a href="/login.html">로그인</a>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    let toastTimer;
    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast is-show ' + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('is-show'), 2600);
    }

    const pw = document.getElementById('password');
    const pwHint = document.getElementById('pw-hint');
    pw.addEventListener('input', () => {
      const ok = pw.value.length >= 8;
      pwHint.textContent = ok ? '사용 가능한 비밀번호입니다' : '8자 이상 입력해주세요';
      pwHint.className = 'hint' + (ok ? ' ok' : (pw.value ? ' bad' : ''));
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const displayName = document.getElementById('displayName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = pw.value;
      if (password.length < 8) { toast('비밀번호는 8자 이상이어야 합니다', 'error'); return; }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = '가입 중…';
      try {
        const res = await fetch('/auth/register', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, displayName })
        });
        const data = await res.json();
        if (res.ok) {
          toast('회원가입이 완료되었습니다', 'success');
          setTimeout(() => { window.location.href = data.redirectUrl || '/additional-user-info.html'; }, 700);
        } else {
          toast(data.message || '회원가입에 실패했습니다', 'error');
          btn.disabled = false;
          btn.textContent = '회원가입';
        }
      } catch (err) {
        toast('네트워크 오류가 발생했습니다', 'error');
        btn.disabled = false;
        btn.textContent = '회원가입';
      }
    });
  </script>
</body>
</html>
