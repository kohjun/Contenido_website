<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>종료된 이벤트</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="container">
    <div class="title-section">
      <h1>종료된 이벤트</h1>
      <p class="subtitle">참여했던 이벤트에 대한 후기를 남겨주세요!</p>
    </div>

    <div id="ended-events-list" class="ended-events-container"></div>

    <!-- 페이지네이션 추가 -->
    <div class="pagination-container">
      <button class="pagination-button" id="prev-page" disabled>&lt; 이전</button>
      <span id="page-info">페이지 1</span>
      <button class="pagination-button" id="next-page">다음 &gt;</button>
    </div>

    <div class="navigation-buttons">
      <button onclick="window.location.href='events.html'" class="nav-button">
        진행중인 이벤트
      </button>
    </div>
  </div>

  <script>
    let currentPage = 1;
    let eventsPerPage = 10;
    let totalEvents = [];

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('/events/ended');
        if (!response.ok) throw new Error('Failed to fetch ended events');

        totalEvents = await response.json();
        displayCurrentPage();

      } catch (error) {
        console.error('Error fetching ended events:', error);
        document.getElementById('ended-events-list').innerHTML = `
          <div class="error-state">
            <p>종료된 이벤트를 불러오는 중 문제가 발생했습니다.</p>
            <p>로그인 후 다시 시도해주세요.</p>
          </div>
        `;
      }
    });

    function displayCurrentPage() {
      const startIndex = (currentPage - 1) * eventsPerPage;
      const endIndex = startIndex + eventsPerPage;
      const currentEvents = totalEvents.slice(startIndex, endIndex);
      const eventsList = document.getElementById('ended-events-list');

      if (totalEvents.length === 0) {
        eventsList.innerHTML = `
          <div class="empty-state">
            <p>아직 종료된 이벤트가 없습니다.</p>
          </div>
        `;
        return;
      }

      eventsList.innerHTML = currentEvents.map(event => `
        <div class="ended-event-card">
          <div class="event-info">
            <h3>${event.title}</h3>
            <div class="event-details">
              <span class="detail-item">
                <i class="icon-calendar"></i>
                ${new Date(event.date).toLocaleDateString()}
              </span>
              <span class="detail-item">
                <i class="icon-location"></i>
                ${event.place}
              </span>
              <span class="detail-item">
                <i class="icon-people"></i>
                참여인원: ${event.finalParticipants?.length || 0}명
              </span>
              <span class="detail-item">
                <i class="icon-money"></i>
                참가비: ${event.participation_fee.toLocaleString()}원
              </span>
            </div>
          </div>
          <div class="review-action">
            ${event.hasReview ? `
              <span class="reviewed-badge">후기 작성 완료</span>
            ` : `
              <button class="review-button" onclick="redirectToReviewPage('${event._id}')">
                후기 작성하기
                <span class="review-icon">✍️</span>
              </button>
            `}
          </div>
        </div>
      `).join('');

      // 페이지네이션 버튼 상태 업데이트
      updatePaginationControls();
    }

    function updatePaginationControls() {
      const totalPages = Math.ceil(totalEvents.length / eventsPerPage);
      const prevButton = document.getElementById('prev-page');
      const nextButton = document.getElementById('next-page');
      const pageInfo = document.getElementById('page-info');

      prevButton.disabled = currentPage === 1;
      nextButton.disabled = currentPage === totalPages;
      pageInfo.textContent = `페이지 ${currentPage} / ${totalPages}`;
    }

    // 페이지네이션 버튼 이벤트 리스너
    document.getElementById('prev-page').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        displayCurrentPage();
      }
    });

    document.getElementById('next-page').addEventListener('click', () => {
      const totalPages = Math.ceil(totalEvents.length / eventsPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        displayCurrentPage();
      }
    });

    function redirectToReviewPage(eventId) {
      window.location.href = `event-review.html?id=${eventId}`;
    }
  </script>
  <script src="/js/utils/nav-injector.js"></script>
</body>
</html>
