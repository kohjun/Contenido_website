<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>종료된 이벤트 · Contenido</title>
  <link rel="icon" href="/images/Contenido_Logo.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/design-system.css?v=20261119" />
  <link rel="stylesheet" href="/css/ended-events.css?v=20261119" />
</head>
<body>
  <main class="container">
    <header class="title-section">
      <h1>종료된 이벤트</h1>
      <p class="subtitle">참여했던 이벤트에 대한 소중한 후기를 남겨주세요!</p>
    </header>

    <!-- 월별 네비게이션 -->
    <div class="month-navigation">
      <button type="button" class="month-nav-button" id="prev-month" aria-label="이전 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="current-month-display">
        <span id="current-year-month" class="c-tabular">2025년 1월</span>
      </div>
      <button type="button" class="month-nav-button" id="next-month" aria-label="다음 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </div>

    <div id="ended-events-list" class="ended-events-container"></div>

    <div class="navigation-buttons">
      <button type="button" onclick="window.location.href='/events.html'" class="nav-button">
        진행중인 이벤트 보기
      </button>
    </div>
  </main>

  <script>
    let allEvents = [];
    let fetchFailed = false;
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth() + 1;

    document.addEventListener('DOMContentLoaded', async () => {
      await fetchEndedEvents();
      updateMonthDisplay();
      if (!fetchFailed) {
        displayEventsForCurrentMonth();
      }

      document.getElementById('prev-month').addEventListener('click', navigateToPreviousMonth);
      document.getElementById('next-month').addEventListener('click', navigateToNextMonth);
    });

    async function fetchEndedEvents() {
      try {
        const response = await fetch('/events/ended');
        if (!response.ok) throw new Error('Failed to fetch ended events');
        allEvents = await response.json();
        fetchFailed = false;
      } catch (error) {
        console.error('Error fetching ended events:', error);
        fetchFailed = true;
        document.getElementById('ended-events-list').innerHTML = `
          <div class="error-state error-state--auth">
            <p class="error-state-title">종료된 이벤트는 로그인 후에 조회 가능합니다.</p>
            <button type="button" class="nav-button" onclick="window.location.href='/login.html'">로그인하러 가기</button>
          </div>
        `;
      }
    }

    function updateMonthDisplay() {
      const display = document.getElementById('current-year-month');
      display.textContent = `${currentYear}년 ${currentMonth}월`;

      if (fetchFailed) {
        document.getElementById('next-month').disabled = true;
        document.getElementById('prev-month').disabled = true;
        return;
      }

      const now = new Date();
      const currentYearMonth = now.getFullYear() * 12 + now.getMonth() + 1;
      const selectedYearMonth = currentYear * 12 + currentMonth;

      document.getElementById('next-month').disabled = selectedYearMonth >= currentYearMonth;
      const oneYearAgo = (now.getFullYear() - 1) * 12 + now.getMonth() + 1;
      document.getElementById('prev-month').disabled = selectedYearMonth <= oneYearAgo;
    }

    function displayEventsForCurrentMonth() {
      if (fetchFailed) return;
      const eventsList = document.getElementById('ended-events-list');

      const filteredEvents = allEvents.filter(event => {
        const eventDate = new Date(event.date);
        return eventDate.getFullYear() === currentYear &&
               eventDate.getMonth() + 1 === currentMonth;
      });

      if (filteredEvents.length === 0) {
        eventsList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2.5"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
            <p>${currentYear}년 ${currentMonth}월에 종료된 이벤트가 없습니다.</p>
          </div>
        `;
        return;
      }

      eventsList.innerHTML = filteredEvents.map(event => {
        const eventDate = new Date(event.date);
        const formattedDate = `${eventDate.getMonth() + 1}월 ${eventDate.getDate()}일`;
        const imageUrl = event.mainImage || event.images?.[0];
        const imageHTML = imageUrl
          ? `<img src="${imageUrl}" alt="${event.title}" loading="lazy" />`
          : `<div class="placeholder" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>`;

        return `
          <article class="ended-event-card">
            <div class="event-image-preview">${imageHTML}</div>
            <div class="event-info">
              <h3>${event.title}</h3>
              <div class="event-details">
                <div class="detail-item">
                  <strong>일시</strong><span class="c-tabular">${formattedDate} ${event.startTime} - ${event.endTime}</span>
                </div>
                <div class="detail-item">
                  <strong>장소</strong><span>${event.place}</span>
                </div>
                <div class="detail-item">
                  <strong>참여인원</strong><span class="c-tabular">${event.finalParticipants?.length || 0}명</span>
                </div>
                <div class="detail-item">
                  <strong>참가비</strong><span class="c-tabular">${(event.participation_fee || 0).toLocaleString()}원</span>
                </div>
              </div>
            </div>
            <div class="review-action">
              ${event.hasReview ? `
                <div class="reviewed-badge">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  <span>후기 완료</span>
                </div>
              ` : `
                <button type="button" class="review-icon-button" onclick="redirectToReviewPage('${event._id}')" title="후기 작성하기" aria-label="후기 작성하기">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </button>
              `}
            </div>
          </article>
        `;
      }).join('');
    }

    function navigateToPreviousMonth() {
      currentMonth--;
      if (currentMonth < 1) { currentMonth = 12; currentYear--; }
      updateMonthDisplay();
      displayEventsForCurrentMonth();
    }

    function navigateToNextMonth() {
      currentMonth++;
      if (currentMonth > 12) { currentMonth = 1; currentYear++; }
      updateMonthDisplay();
      displayEventsForCurrentMonth();
    }

    function redirectToReviewPage(eventId) {
      window.location.href = `/event-review.html?id=${eventId}`;
    }
  </script>
  <script src="/js/utils/nav-injector.js?v=20261119"></script>
</body>
</html>
