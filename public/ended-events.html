<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>종료된 이벤트 · Contenido</title>
  <link rel="stylesheet" href="/css/ended-events.css?v=20260531" />
</head>
<body>
  <div class="container">
    <div class="title-section">
      <h1>종료된 이벤트</h1>
      <p class="subtitle">참여했던 이벤트에 대한 후기를 남겨주세요!</p>
    </div>

    <!-- 월별 네비게이션 -->
    <div class="month-navigation">
      <button class="month-nav-button" id="prev-month" aria-label="이전 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="current-month-display">
        <span id="current-year-month">2025년 1월</span>
      </div>
      <button class="month-nav-button" id="next-month" aria-label="다음 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
    </div>

    <div id="ended-events-list" class="ended-events-container"></div>

    <div class="navigation-buttons">
      <button onclick="window.location.href='events.html'" class="nav-button">
        진행중인 이벤트
      </button>
    </div>
  </div>

  <script>
    let allEvents = [];
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth() + 1; // 1-12

    document.addEventListener('DOMContentLoaded', async () => {
      await fetchEndedEvents();
      updateMonthDisplay();
      displayEventsForCurrentMonth();

      // 네비게이션 버튼 이벤트 리스너
      document.getElementById('prev-month').addEventListener('click', navigateToPreviousMonth);
      document.getElementById('next-month').addEventListener('click', navigateToNextMonth);
    });

    async function fetchEndedEvents() {
      try {
        const response = await fetch('/events/ended');
        if (!response.ok) throw new Error('Failed to fetch ended events');
        allEvents = await response.json();
      } catch (error) {
        console.error('Error fetching ended events:', error);
        document.getElementById('ended-events-list').innerHTML = `
          <div class="error-state">
            <p>종료된 이벤트를 불러오는 중 문제가 발생했습니다.</p>
            <p>로그인 후 다시 시도해주세요.</p>
          </div>
        `;
      }
    }

    function updateMonthDisplay() {
      const display = document.getElementById('current-year-month');
      display.textContent = `${currentYear}년 ${currentMonth}월`;

      // 버튼 활성화/비활성화
      const now = new Date();
      const currentYearMonth = now.getFullYear() * 12 + now.getMonth() + 1;
      const selectedYearMonth = currentYear * 12 + currentMonth;

      // 다음 달 버튼은 현재 월보다 미래면 비활성화
      document.getElementById('next-month').disabled = selectedYearMonth >= currentYearMonth;

      // 이전 달 버튼은 너무 과거면 비활성화 (예: 1년 전)
      const oneYearAgo = (now.getFullYear() - 1) * 12 + now.getMonth() + 1;
      document.getElementById('prev-month').disabled = selectedYearMonth <= oneYearAgo;
    }

    function displayEventsForCurrentMonth() {
      const eventsList = document.getElementById('ended-events-list');

      // 현재 선택된 연도/월에 해당하는 이벤트 필터링
      const filteredEvents = allEvents.filter(event => {
        const eventDate = new Date(event.date);
        return eventDate.getFullYear() === currentYear &&
               eventDate.getMonth() + 1 === currentMonth;
      });

      if (filteredEvents.length === 0) {
        eventsList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📅</div>
            <p>${currentYear}년 ${currentMonth}월에 종료된 이벤트가 없습니다.</p>
          </div>
        `;
        return;
      }

      eventsList.innerHTML = filteredEvents.map(event => {
        const eventDate = new Date(event.date);
        const formattedDate = `${eventDate.getMonth() + 1}월 ${eventDate.getDate()}일`;

        // 이미지 URL 처리
        const imageUrl = event.mainImage || event.images?.[0];
        const imageHTML = imageUrl
          ? `<img src="${imageUrl}" alt="${event.title}" />`
          : `<div class="placeholder">📸</div>`;

        return `
          <div class="ended-event-card">
            <!-- 이미지 프리뷰 -->
            <div class="event-image-preview">
              ${imageHTML}
            </div>

            <!-- 이벤트 정보 -->
            <div class="event-info">
              <h3>${event.title}</h3>
              <div class="event-details">
                <div class="detail-item">
                  <strong>일시:</strong> ${formattedDate} ${event.startTime} - ${event.endTime}
                </div>
                <div class="detail-item">
                  <strong>장소:</strong> ${event.place}
                </div>
                <div class="detail-item">
                  <strong>참여인원:</strong> ${event.finalParticipants?.length || 0}명
                </div>
                <div class="detail-item">
                  <strong>참가비:</strong> ${event.participation_fee.toLocaleString()}원
                </div>
              </div>
            </div>

            <!-- 후기 작성 액션 -->
            <div class="review-action">
              ${event.hasReview ? `
                <div class="reviewed-badge">
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                  </svg>
                  완료
                </div>
              ` : `
                <button
                  class="review-icon-button"
                  onclick="redirectToReviewPage('${event._id}')"
                  title="후기 작성하기"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function navigateToPreviousMonth() {
      currentMonth--;
      if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
      }
      updateMonthDisplay();
      displayEventsForCurrentMonth();
    }

    function navigateToNextMonth() {
      currentMonth++;
      if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
      }
      updateMonthDisplay();
      displayEventsForCurrentMonth();
    }

    function redirectToReviewPage(eventId) {
      window.location.href = `event-review.html?id=${eventId}`;
    }
  </script>
  <script src="/js/utils/nav-injector.js?v=20260533"></script>
</body>
</html>
