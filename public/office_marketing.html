<div class="marketing-dashboard">
  <header class="promo-header">
    <div class="header-text">
      <h2>홍보 모달 및 혜택 이벤트 관리 📣</h2>
      <p>웹사이트 방문객에게 노출되는 홍보 팝업 모달과 전용 혜택 페이지를 기획하고 제어합니다.</p>
    </div>
    <button type="button" class="btn-create-promo" onclick="window.MarketingDashboard.openCreateModal()">
      <span>+</span> 신규 홍보 등록
    </button>
  </header>

  <!-- 프로모션 목록 -->
  <section class="promo-list-section">
    <div class="section-title">등록된 홍보 및 혜택 목록</div>
    <div id="promotion-list" class="promo-grid">
      <div class="loading-placeholder">홍보 목록을 불러오는 중...</div>
    </div>
  </section>

  <!-- 등록 / 수정 모달 -->
  <div id="promo-form-modal" class="promo-modal-overlay" style="display: none;">
    <div class="promo-modal-container">
      <header class="promo-modal-header">
        <h3 id="promo-modal-title">신규 홍보 등록</h3>
        <button type="button" class="promo-modal-close" onclick="window.MarketingDashboard.closeFormModal()">×</button>
      </header>
      <form id="promo-form" onsubmit="window.MarketingDashboard.handleSubmit(event)">
        <input type="hidden" id="promo-id" name="id">
        
        <div class="form-group">
          <label for="promo-title">홍보 이벤트 제목 <span class="required">*</span></label>
          <input type="text" id="promo-title" name="title" placeholder="예: 7월 특별 혜택! 치킨 기프티콘 이벤트" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="promo-start-date">노출 시작일 <span class="required">*</span></label>
            <input type="date" id="promo-start-date" name="startDate" required>
          </div>
          <div class="form-group">
            <label for="promo-end-date">노출 종료일 <span class="required">*</span></label>
            <input type="date" id="promo-end-date" name="endDate" required>
          </div>
        </div>

        <div class="form-group">
          <label for="promo-photo">모달 썸네일 이미지 <span class="required" id="photo-required">*</span></label>
          <div class="file-upload-wrapper">
            <input type="file" id="promo-photo" name="photo" accept="image/*" onchange="window.MarketingDashboard.handlePhotoChange(event)">
            <div class="file-upload-preview" id="photo-preview-container">
              <span class="preview-placeholder">이미지 파일을 선택해 주세요 (1:1 비율 권장)</span>
              <img id="photo-preview" src="" alt="미리보기" style="display: none;">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="promo-event-id">연동할 동아리 이벤트 <span class="helper-text">(선택)</span></label>
          <select id="promo-event-id" name="targetEventId">
            <option value="null">선택하지 않음 (이벤트와 무관한 단순 홍보)</option>
          </select>
        </div>

        <div class="form-group checkbox-group center-checkbox">
          <label class="toggle-switch">
            <input type="checkbox" id="promo-is-active" name="isActive" checked>
            <span class="slider"></span>
          </label>
          <span class="toggle-label">즉시 활성화 (기간 내 노출)</span>
        </div>

        <div class="form-group">
          <label for="promo-benefit-detail">혜택 상세 설명 (HTML 지원) <span class="required">*</span></label>
          <textarea id="promo-benefit-detail" name="benefitDetail" placeholder="혜택 페이지에서 상세히 보일 문구를 자유롭게 작성해주세요. HTML 태그를 지원합니다.&#10;예:&#10;&lt;h3&gt;치킨 기프티콘 받아가세요!&lt;/h3&gt;&#10;&lt;p&gt;7월 15일부터 7월 31일까지 진행되는 아래 이벤트에 참가 신청해주신 분들 중 추첨을 통해 5분께 뿌링클 세트를 드립니다!&lt;/p&gt;" required></textarea>
        </div>

        <div class="promo-modal-footer">
          <button type="button" class="btn-cancel" onclick="window.MarketingDashboard.closeFormModal()">취소</button>
          <button type="submit" class="btn-submit" id="btn-submit-promo">저장하기</button>
        </div>
      </form>
    </div>
  </div>
</div>
