<div class="marketing-dashboard">
  <header class="promo-header">
    <div class="header-text">
      <h2>홍보 모달 및 혜택 이벤트 관리 📣</h2>
      <p>웹사이트 방문객에게 노출되는 홍보 팝업 모달과 전용 혜택 페이지를 기획하고 제어합니다.</p>
    </div>
    <button type="button" class="btn-create-promo" onclick="window.MarketingDashboard.openCreateModal()">
      <span>+</span> 신규 홍보 등록
    </button>
  </header>

  <!-- 프로모션 목록 -->
  <section class="promo-list-section">
    <div class="section-title">등록된 홍보 및 혜택 목록</div>
    <div id="promotion-list" class="promo-grid">
      <div class="loading-placeholder">홍보 목록을 불러오는 중...</div>
    </div>
  <!-- 월별 서포터즈 관리 섹션 -->
  <section class="supporter-section" style="margin-top: 30px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border-radius: 20px; padding: 24px; border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 10px 30px rgba(236, 72, 153, 0.08);">
    <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
      <div>
        <h3 style="margin: 0 0 6px; font-size: 1.2rem; color: #9d174d; display: flex; align-items: center; gap: 8px;">
          <span>🌟</span> 월별 서포터즈 명단 확정 (현재 월)
        </h3>
        <p style="margin: 0; font-size: 0.88rem; color: #831843;">현재 진행 월의 서포터즈 인원을 선택하고 저장하면 인사팀 페이지에서 '서포터즈' 표시 및 의무 신청 경고가 자동으로 면제됩니다.</p>
      </div>
      <div class="supporter-month-picker" style="display: flex; align-items: center; gap: 10px;">
        <select id="supporter-year" onchange="window.MarketingDashboard.loadSupporters()" style="padding: 8px 12px; border-radius: 10px; border: 1px solid #fbcfe8; font-weight: 600; color: #9d174d; background: #fff;">
          <option value="2026">2026년</option>
          <option value="2025">2025년</option>
        </select>
        <select id="supporter-month" onchange="window.MarketingDashboard.loadSupporters()" style="padding: 8px 12px; border-radius: 10px; border: 1px solid #fbcfe8; font-weight: 600; color: #9d174d; background: #fff;">
          <option value="1">1월</option>
          <option value="2">2월</option>
          <option value="3">3월</option>
          <option value="4">4월</option>
          <option value="5">5월</option>
          <option value="6">6월</option>
          <option value="7">7월</option>
          <option value="8">8월</option>
          <option value="9">9월</option>
          <option value="10">10월</option>
          <option value="11">11월</option>
          <option value="12">12월</option>
        </select>
      </div>
    </div>

    <!-- 검색 및 명단 영역 -->
    <div class="supporter-card-body" style="background: #fff; border-radius: 16px; padding: 20px; border: 1px solid #fbcfe8;">
      <div style="display: flex; gap: 12px; margin-bottom: 16px; align-items: center;">
        <input type="text" id="supporter-search" placeholder="회원 이름 또는 전화번호 뒷자리로 검색..." oninput="window.MarketingDashboard.filterSupporterMembers()" style="flex: 1; padding: 10px 14px; border: 1px solid #f472b6; border-radius: 10px; font-size: 0.9rem; outline: none;">
        <span style="font-size: 0.88rem; color: #9d174d; font-weight: 600;">선택된 서포터즈: <b id="supporter-selected-count" style="color: #ec4899;">0</b>명</span>
      </div>

      <div id="supporter-member-list" class="supporter-member-grid" style="max-height: 280px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 4px;">
        <div class="loading-placeholder">회원 목록을 불러오는 중...</div>
      </div>

      <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
        <button type="button" class="btn-submit" onclick="window.MarketingDashboard.saveSupporters()" style="background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);">
          서포터즈 명단 확정/저장
        </button>
      </div>
    </div>
  </section>

  <!-- 등록 / 수정 모달 -->
  <div id="promo-form-modal" class="promo-modal-overlay" style="display: none;">
    <div class="promo-modal-container">
      <header class="promo-modal-header">
        <h3 id="promo-modal-title">신규 홍보 등록</h3>
        <button type="button" class="promo-modal-close" onclick="window.MarketingDashboard.closeFormModal()">×</button>
      </header>
      <form id="promo-form" onsubmit="window.MarketingDashboard.handleSubmit(event)">
        <input type="hidden" id="promo-id" name="id">
        
        <div class="form-group">
          <label for="promo-title">홍보 이벤트 제목 <span class="required">*</span></label>
          <input type="text" id="promo-title" name="title" placeholder="예: 7월 특별 혜택! 치킨 기프티콘 이벤트" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="promo-start-date">노출 시작일 <span class="required">*</span></label>
            <input type="date" id="promo-start-date" name="startDate" required>
          </div>
          <div class="form-group">
            <label for="promo-end-date">노출 종료일 <span class="required">*</span></label>
            <input type="date" id="promo-end-date" name="endDate" required>
          </div>
        </div>

        <div class="form-group">
          <label for="promo-photo">모달 썸네일 이미지 <span class="required" id="photo-required">*</span></label>
          <div class="file-upload-wrapper">
            <input type="file" id="promo-photo" name="photo" accept="image/*" onchange="window.MarketingDashboard.handlePhotoChange(event)">
            <div class="file-upload-preview" id="photo-preview-container">
              <span class="preview-placeholder">이미지 파일을 선택해 주세요 (1:1 비율 권장)</span>
              <img id="photo-preview" src="" alt="미리보기" style="display: none;">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="promo-event-id">연동할 동아리 이벤트 <span class="helper-text">(선택)</span></label>
          <select id="promo-event-id" name="targetEventId">
            <option value="null">선택하지 않음 (이벤트와 무관한 단순 홍보)</option>
          </select>
        </div>

        <div class="form-group checkbox-group center-checkbox">
          <label class="toggle-switch">
            <input type="checkbox" id="promo-is-active" name="isActive" checked>
            <span class="slider"></span>
          </label>
          <span class="toggle-label">즉시 활성화 (기간 내 노출)</span>
        </div>

        <div class="form-group">
          <label for="promo-benefit-detail">혜택 상세 설명 (HTML 지원) <span class="required">*</span></label>
          <textarea id="promo-benefit-detail" name="benefitDetail" placeholder="혜택 페이지에서 상세히 보일 문구를 자유롭게 작성해주세요. HTML 태그를 지원합니다.&#10;예:&#10;&lt;h3&gt;치킨 기프티콘 받아가세요!&lt;/h3&gt;&#10;&lt;p&gt;7월 15일부터 7월 31일까지 진행되는 아래 이벤트에 참가 신청해주신 분들 중 추첨을 통해 5분께 뿌링클 세트를 드립니다!&lt;/p&gt;" required></textarea>
        </div>

        <div class="promo-modal-footer">
          <button type="button" class="btn-cancel" onclick="window.MarketingDashboard.closeFormModal()">취소</button>
          <button type="submit" class="btn-submit" id="btn-submit-promo">저장하기</button>
        </div>
      </form>
    </div>
  </div>
</div>
