<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이벤트 참가 현황</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    /* isSelective가 true일 때 기존 표 형식 숨기기 */
    .hidden {
      display: none;
    }
    
    /* 모바일 반응형 스타일 추가 */
    @media (max-width: 768px) {
      table th, table td {
        padding: 6px 4px;
        font-size: 0.85rem;
      }
      
      .role-badge {
        font-size: 0.7rem;
        padding: 2px 4px;
        min-width: 40px;
      }
      
      .application-item {
        padding: 10px;
      }
    }
    
    /* 역할과 성별 표시를 위한 추가 스타일 */
    .role-gender {
      margin-top: 5px;
      display: inline-block;
    }
    
    /* 지원서 항목 스타일 개선 */
    .participant-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>이벤트 참가 현황</h1>
    <div id="event-details"></div>
    <table id="participant-table">
      <thead>
        <tr>
          <th>이름(생년)</th>
          <th>역할(성별)</th>
          <th>전화번호</th>
          <th>신청일시</th>
          <th>상태</th>
          <th>관리</th>
        </tr>
      </thead>
      <tbody id="participant-list"></tbody>
    </table>
    <div id="application-list"></div>

    <!-- 지원서 모달 -->
    <div id="application-modal" class="modal">
      <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div id="application-content"></div>
      </div>
    </div>

    <button onclick="window.location.href='event-staff.html'" class="back-button">돌아가기</button>
  </div>

  <script src="/js/event-status.js"></script>
</body>
</html>
