<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이벤트 후기 · Contenido</title>
  <link rel="stylesheet" href="/css/event-review.css?v=20260530">
</head>
<body>
  <div class="container">
    <!-- 이벤트 헤더 -->
    <div class="event-header">
      <h1>이벤트 후기</h1>
      <div id="event-details" class="event-summary"></div>
    </div>

    <!-- 리뷰 섹션 -->
    <div class="review-section">
      <!-- 비참가자 안내 메시지 -->
      <div id="review-notice" class="notice-message" style="display: none;"></div>
      
      <!-- 리뷰 작성 폼 -->
      <form id="review-form" class="review-form" style="display: none;">
        <div class="rating-container">
          <label>별점을 선택해주세요</label>
          <div class="star-rating">
            <div class="stars">
              <span class="star" data-rating="1">★</span>
              <span class="star" data-rating="2">★</span>
              <span class="star" data-rating="3">★</span>
              <span class="star" data-rating="4">★</span>
              <span class="star" data-rating="5">★</span>
            </div>
            <input type="hidden" id="rating" name="rating" required>
          </div>
        </div>

        <div class="comment-container">
          <label for="comment">후기를 작성해주세요</label>
          <textarea 
            id="comment" 
            name="comment" 
            placeholder="이벤트에 대한 솔직한 후기를 남겨주세요." 
            required
          ></textarea>
        </div>

        <div class="form-footer">
          <label class="anonymous-checkbox">
            <input type="checkbox" id="anonymous" name="anonymous">
            <span class="checkbox-text">익명으로 작성하기</span>
          </label>
          <button type="submit" class="submit-button">
            <span class="button-text">후기 등록</span>
          </button>
        </div>
      </form>

      <!-- 리뷰 목록 -->
      <div class="reviews-container">
        <h2>후기 목록</h2>
        <div id="reviews-list" class="reviews-list"></div>
      </div>
    </div>

    <!-- 네비게이션 -->
    <div class="navigation">
      <button onclick="window.location.href='ended-events.html'" class="back-button">
        <span class="button-text">돌아가기</span>
      </button>
    </div>
  </div>

  <script src="./js/event-review.js"></script>
  <script src="./js/utils/nav-injector.js?v=20260602"></script>
</body>
</html>
