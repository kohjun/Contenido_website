<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이벤트 후기 · Contenido</title>
  <link rel="icon" href="/images/Contenido_Logo.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/design-system.css?v=20261119">
  <link rel="stylesheet" href="/css/event-review.css?v=20261119">
</head>
<body>
  <main class="container">
    <header class="event-header">
      <h1>이벤트 후기</h1>
      <div id="event-details" class="event-summary"></div>
    </header>

    <section class="review-section">
      <div id="review-notice" class="notice-message" style="display: none;"></div>

      <form id="review-form" class="review-form" style="display: none;">
        <div class="rating-container">
          <label>별점을 선택해주세요</label>
          <div class="star-rating">
            <div class="stars" role="radiogroup" aria-label="별점 선택">
              <span class="star" data-rating="1" role="radio" tabindex="0" aria-label="1점">★</span>
              <span class="star" data-rating="2" role="radio" tabindex="0" aria-label="2점">★</span>
              <span class="star" data-rating="3" role="radio" tabindex="0" aria-label="3점">★</span>
              <span class="star" data-rating="4" role="radio" tabindex="0" aria-label="4점">★</span>
              <span class="star" data-rating="5" role="radio" tabindex="0" aria-label="5점">★</span>
            </div>
            <input type="hidden" id="rating" name="rating" required>
          </div>
        </div>

        <div class="comment-container">
          <label for="comment">후기를 작성해주세요</label>
          <textarea
            id="comment"
            name="comment"
            placeholder="이벤트에 대한 솔직한 후기를 남겨주세요."
            required
          ></textarea>
        </div>

        <div class="form-footer">
          <label class="anonymous-checkbox">
            <input type="checkbox" id="anonymous" name="anonymous">
            <span class="checkbox-text">익명으로 작성하기</span>
          </label>
          <button type="submit" class="submit-button">
            <span class="button-text">후기 등록</span>
          </button>
        </div>
      </form>

      <div class="reviews-container">
        <h2>후기 목록</h2>
        <div id="reviews-list" class="reviews-list"></div>
      </div>
    </section>

    <div class="navigation">
      <button type="button" onclick="window.location.href='/ended-events.html'" class="back-button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span class="button-text">종료된 이벤트로 돌아가기</span>
      </button>
    </div>
  </main>

  <script src="/js/event-review.js"></script>
  <script src="/js/utils/nav-injector.js?v=20261119"></script>
</body>
</html>
